name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest # Apple Silicon runner -> arm64 build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Smoke test
        run: npm run smoke

      - name: Build DMG
        run: npm run dmg

      - uses: actions/upload-artifact@v4
        with:
          name: Prompt-Manager-dmg
          path: dist/*.dmg

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION" && exit 1
          fi
          gh release create "$GITHUB_REF_NAME" dist/*.dmg --title "Prompt Manager $GITHUB_REF_NAME" --generate-notes
