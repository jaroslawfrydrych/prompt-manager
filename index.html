<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:">
  <title>Prompt Manager</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside id="sidebar">
    <div class="drag sidebar-top"></div>
    <nav id="nav"></nav>
    <button class="update" id="update" hidden>
      <svg viewBox="0 0 16 16"><path d="M8 2.5v8M4.5 7 8 10.5 11.5 7M3 13.5h10"/></svg>
      <span>Update available</span>
    </button>
  </aside>
  <main id="main">
    <header class="toolbar drag">
      <div class="title-wrap">
        <h1 id="title"></h1>
        <div class="subline"><span id="subtitle"></span><button class="folder no-drag" id="folder" hidden></button></div>
      </div>
      <div class="segmented no-drag" id="tabs">
        <button data-tab="pending">Pending</button>
        <button data-tab="done">Done</button>
      </div>
      <label class="search no-drag">
        <svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.6"/><path d="M10.5 10.5 14 14"/></svg>
        <input id="search" type="search" placeholder="Search" spellcheck="false">
      </label>
      <button class="icon-btn no-drag" id="new-prompt" title="New Prompt (⌘N)">
        <svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg>
      </button>
    </header>
    <section id="list"></section>
  </main>
  <dialog id="project-dialog">
    <form method="dialog">
      <h2 id="pd-title"></h2>
      <p class="pd-hint" id="pd-hint" hidden></p>
      <label class="pd-field"><span>Name</span><input id="pd-name" placeholder="Project name" spellcheck="false"></label>
      <div class="pd-field"><span>Folder</span><span class="pd-path" id="pd-path"></span><button type="button" class="pd-btn" id="pd-choose">Choose…</button></div>
      <!-- OK comes first so Enter submits it; CSS shows it on the right. -->
      <div class="pd-buttons"><button value="ok" class="primary" id="pd-ok"></button><button value="cancel" class="pd-btn">Cancel</button></div>
    </form>
  </dialog>
  <div class="popmenu" id="popmenu" popover></div>
  <script src="renderer.js"></script>
</body>
</html>
